name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-test:
    name: CLI Tests (Python ${{ matrix.python-version}} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: cli/.venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('cli/poetry.lock') }}

      - name: Install dependencies
        working-directory: cli
        run: poetry install

      - name: Run Ruff linter
        working-directory: cli
        run: poetry run ruff check .

      - name: Run Ruff formatter check
        working-directory: cli
        run: poetry run ruff format --check .

      - name: Run MyPy
        working-directory: cli
        run: poetry run mypy src

      - name: Run tests with coverage
        working-directory: cli
        run: poetry run pytest --cov=src/radiant --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: cli/coverage.xml
          flags: cli
          token: ${{ secrets.CODECOV_TOKEN }}

  server-test:
    name: Server Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: server/.venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('server/poetry.lock') }}

      - name: Install dependencies
        working-directory: server
        run: poetry install

      - name: Run Ruff linter
        working-directory: server
        run: poetry run ruff check .

      - name: Run Ruff formatter check
        working-directory: server
        run: poetry run ruff format --check .

      - name: Run MyPy
        working-directory: server
        run: poetry run mypy src

      - name: Run tests with coverage
        working-directory: server
        run: poetry run pytest --cov=src/radiant_server --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: server/coverage.xml
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
