version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radiant
      POSTGRES_USER: radiant
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - radiant-network

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      platforms:
        - linux/amd64
        - linux/arm64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://radiant:${DB_PASSWORD:-changeme}@postgres:5432/radiant
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - ./config:/app/config:ro
    networks:
      - radiant-network
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      platforms:
        - linux/amd64
        - linux/arm64
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - radiant-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  radiant-network:
    driver: bridge
