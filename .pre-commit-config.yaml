default_install_hook_types:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
        exclude: ^frontend/tsconfig\.json$
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: check-executables-have-shebangs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cli-ci
        name: CLI CI parity
        entry: bash -c "cd cli && poetry run ruff check . && poetry run ruff format --check . && poetry run mypy src && poetry run pytest --cov=src/radiant --cov-report=term-missing"
        language: system
        pass_filenames: false

      - id: server-ci
        name: Server CI parity
        entry: bash -c "cd server && poetry run ruff check . && poetry run ruff format --check . && poetry run mypy src && poetry run pytest --cov=src/radiant_server --cov-report=term-missing"
        language: system
        pass_filenames: false

      - id: frontend-ci
        name: Frontend CI parity
        entry: bash -c "cd frontend && npm ci && npm run type-check && npm run lint && npm run build"
        language: system
        pass_filenames: false
